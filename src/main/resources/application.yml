spring:
  application:
    name: sstt
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sstt}
    username: ${SPRING_DATASOURCE_USERNAME:sstt}
    password: ${SPRING_DATASOURCE_PASSWORD:sstt}
  flyway:
    enabled: true
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
