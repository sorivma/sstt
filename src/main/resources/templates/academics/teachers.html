<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Преподаватели - SSTT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Преподаватели</h1>
            <div class="muted">Контакты преподавателей для задач и предметов.</div>
        </div>
    </div>

    <div class="grid">
        <form class="panel" method="post" th:action="@{/teachers}" th:object="${teacherForm}">
            <h2>Новый преподаватель</h2>
            <label>
                ФИО
                <input th:field="*{fullName}" placeholder="Иванов И.И.">
                <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Ошибка</span>
            </label>
            <div class="form-grid">
                <label>
                    Email
                    <input type="email" th:field="*{email}">
                </label>
                <label>
                    Telegram
                    <input th:field="*{telegram}" placeholder="@teacher">
                </label>
            </div>
            <label>
                Заметки
                <textarea th:field="*{notes}"></textarea>
            </label>
            <div class="actions">
                <button type="submit">Создать</button>
            </div>
        </form>

        <section class="panel">
            <h2>Список</h2>
            <div class="stack">
                <article th:each="teacher : ${teachers}">
                    <strong th:text="${teacher.fullName()}">Преподаватель</strong>
                    <div class="muted" th:text="${teacher.email()}">email</div>
                    <div class="muted" th:text="${teacher.telegram()}">telegram</div>
                    <div th:text="${teacher.notes()}">Заметки</div>
                </article>
                <p class="muted" th:if="${teachers.isEmpty()}">Преподавателей пока нет.</p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
