<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Предметы - SSTT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Предметы</h1>
            <div class="muted">Минимальный справочник для привязки задач.</div>
        </div>
    </div>

    <div class="grid">
        <form class="panel" method="post" th:action="@{/subjects}" th:object="${subjectForm}">
            <h2>Новый предмет</h2>
            <label>
                Название
                <input th:field="*{name}" placeholder="Базы данных">
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка</span>
            </label>
            <label>
                Семестр
                <input th:field="*{semester}" placeholder="Весна 2026">
            </label>
            <label>
                Описание
                <textarea th:field="*{description}"></textarea>
            </label>
            <div class="actions">
                <button type="submit">Создать</button>
            </div>
        </form>

        <section class="panel">
            <h2>Список</h2>
            <div class="stack">
                <article th:each="subject : ${subjects}">
                    <strong th:text="${subject.name()}">Предмет</strong>
                    <div class="muted" th:text="${subject.semester()}">Семестр</div>
                    <div th:text="${subject.description()}">Описание</div>
                </article>
                <p class="muted" th:if="${subjects.isEmpty()}">Предметов пока нет.</p>
            </div>
        </section>
    </div>
</main>
</body>
</html>
