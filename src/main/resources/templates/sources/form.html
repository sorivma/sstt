<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новое сообщение - SSTT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Новое сообщение</h1>
            <div class="muted">Вставь текст от преподавателя, старосты или LMS.</div>
        </div>
    </div>

    <form class="panel" method="post" th:action="@{/sources}" th:object="${sourceMessageForm}">
        <div class="form-grid">
            <label>
                Тип источника
                <select th:field="*{sourceType}">
                    <option th:each="type : ${sourceTypes}" th:value="${type}" th:text="${type}"></option>
                </select>
            </label>

            <label>
                Отправитель
                <input th:field="*{sender}" placeholder="Иванов И.И.">
            </label>
        </div>

        <label>
            Текст сообщения
            <textarea th:field="*{rawText}" placeholder="Коллеги, лабораторную №4 нужно сдать до следующего вторника."></textarea>
            <span class="error" th:if="${#fields.hasErrors('rawText')}" th:errors="*{rawText}">Ошибка</span>
        </label>

        <div class="actions">
            <button type="submit">Разобрать</button>
            <a class="button secondary" th:href="@{/sources}">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
