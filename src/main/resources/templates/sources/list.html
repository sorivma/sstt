<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Источники - SSTT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="container">
    <div class="page-head">
        <div>
            <h1>Источники</h1>
            <div class="muted">Сырые сообщения, из которых создаются задачи.</div>
        </div>
        <a class="button" th:href="@{/sources/new}">Добавить сообщение</a>
    </div>

    <section class="stack">
        <article class="panel" th:each="message : ${messages}">
            <div class="page-head">
                <div>
                    <strong th:text="${message.sourceType()}">MANUAL</strong>
                    <span class="badge" th:text="${message.processingStatus()}">NEW</span>
                    <div class="muted" th:if="${message.sender() != null}" th:text="${message.sender()}">Отправитель</div>
                </div>
                <a class="button secondary" th:href="@{/sources/{id}/draft-task(id=${message.id()})}">Черновик задачи</a>
            </div>
            <pre class="source-text" th:text="${message.rawText()}">Текст</pre>
        </article>
        <div class="panel" th:if="${messages.isEmpty()}">
            <h2>Сообщений пока нет</h2>
            <p class="muted">Добавь первое сообщение вручную.</p>
        </div>
    </section>
</main>
</body>
</html>
