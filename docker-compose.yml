services:
  postgres:
    image: postgres:18.4-alpine
    container_name: sstt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sstt}
      POSTGRES_USER: ${POSTGRES_USER:-sstt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sstt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
