<!doctype html>
<html lang="en" data-theme="sstt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Profile</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-base-100 text-base-content">
<main class="app-shell">
  <header class="mb-6 flex flex-col gap-4 border-b border-base-300 pb-5 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm font-semibold uppercase tracking-normal text-secondary">Identity</p>
      <h1 class="mt-1 text-3xl font-bold tracking-normal text-base-content">Student profile</h1>
    </div>
    <div class="badge badge-outline gap-2 px-3 py-3 font-medium">
      <svg class="icon" aria-hidden="true">
        <use th:href="@{/vendor/lucide/sprite.svg#id-card}"></use>
      </svg>
      Projection backed
    </div>
  </header>

  <section class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(360px,440px)]">
    <aside class="rounded-box border border-base-300 bg-base-100 p-6 shadow-sm">
      <div class="flex items-start gap-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-box bg-primary text-primary-content">
          <svg class="h-6 w-6" aria-hidden="true">
            <use th:href="@{/vendor/lucide/sprite.svg#user}"></use>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-base-content/60">Student card</p>
          <h2 class="mt-1 break-words text-2xl font-bold tracking-normal" th:text="${student != null ? student.fullName : 'Student profile'}">Student profile</h2>
        </div>
      </div>

      <div class="mt-6 grid gap-3" th:if="${student != null}">
        <div class="rounded-box border border-base-300 bg-base-200/60 p-4">
          <div class="flex items-center gap-2 text-sm font-semibold text-base-content/60">
            <svg class="icon" aria-hidden="true">
              <use th:href="@{/vendor/lucide/sprite.svg#mail}"></use>
            </svg>
            Email
          </div>
          <p class="mt-2 break-words font-semibold" th:text="${student.email}">student@example.com</p>
        </div>
        <div class="rounded-box border border-base-300 bg-base-200/60 p-4">
          <div class="flex items-center gap-2 text-sm font-semibold text-base-content/60">
            <svg class="icon" aria-hidden="true">
              <use th:href="@{/vendor/lucide/sprite.svg#users}"></use>
            </svg>
            Group
          </div>
          <p class="mt-2 font-semibold" th:text="${student.groupName}">IKBO-00-00</p>
        </div>
        <div class="rounded-box border border-base-300 bg-base-200/60 p-4">
          <div class="flex items-center gap-2 text-sm font-semibold text-base-content/60">
            <svg class="icon" aria-hidden="true">
              <use th:href="@{/vendor/lucide/sprite.svg#git-commit-horizontal}"></use>
            </svg>
            Stream version
          </div>
          <p class="mt-2 font-semibold" th:text="${student.streamVersion}">1</p>
        </div>
      </div>
    </aside>

    <form class="rounded-box border border-base-300 bg-base-100 p-6 shadow-sm" method="post" th:action="@{/profile}" th:object="${profileForm}">
      <div class="alert alert-success mb-5 items-center" th:if="${saved}">
        <svg class="icon" aria-hidden="true">
          <use th:href="@{/vendor/lucide/sprite.svg#circle-check}"></use>
        </svg>
        <span>Profile updated</span>
      </div>

      <div class="grid gap-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Full name</legend>
          <input class="input w-full" type="text" th:field="*{fullName}" autocomplete="name">
          <p class="label text-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Required</p>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Email</legend>
          <input class="input w-full" type="email" th:field="*{email}" autocomplete="email">
          <p class="label text-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Invalid email</p>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Group</legend>
          <input class="input w-full" type="text" th:field="*{groupName}">
          <p class="label text-error" th:if="${#fields.hasErrors('groupName')}" th:errors="*{groupName}">Required</p>
        </fieldset>

        <button class="btn btn-primary mt-2 gap-2" type="submit">
          <svg class="icon" aria-hidden="true">
            <use th:href="@{/vendor/lucide/sprite.svg#save}"></use>
          </svg>
          Save profile
        </button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
