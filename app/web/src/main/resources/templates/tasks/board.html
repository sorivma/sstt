<!doctype html>
<html lang="en" data-theme="sstt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-base-100 text-base-content">
<div class="app-frame">
  <aside th:replace="~{fragments/app-shell :: sidebar('tasks')}"></aside>

  <div class="app-main">
    <header th:replace="~{fragments/app-shell :: topbar('Tasks', 'Plan coursework, labs, exams, and teacher follow-ups')}"></header>

    <main class="grid gap-5 p-4 sm:p-6 lg:p-8">
      <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
        <div class="metric-panel">
          <span class="metric-label">Open tasks</span>
          <strong class="metric-value">0</strong>
        </div>
        <div class="metric-panel">
          <span class="metric-label">Due this week</span>
          <strong class="metric-value">0</strong>
        </div>
        <div class="metric-panel">
          <span class="metric-label">Subjects tracked</span>
          <strong class="metric-value">0</strong>
        </div>
        <div class="metric-panel">
          <span class="metric-label">Teachers tracked</span>
          <strong class="metric-value">0</strong>
        </div>
      </section>

      <section class="rounded-box border border-base-300 bg-base-100 p-4 shadow-sm">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <div class="join w-full lg:max-w-xl">
            <label class="input join-item flex w-full items-center gap-2">
              <svg class="icon text-base-content/45" aria-hidden="true">
                <use th:href="@{/vendor/lucide/sprite.svg#search}"></use>
              </svg>
              <input type="search" placeholder="Search tasks" disabled>
            </label>
            <button class="btn join-item gap-2" type="button" disabled>
              <svg class="icon" aria-hidden="true">
                <use th:href="@{/vendor/lucide/sprite.svg#list-filter}"></use>
              </svg>
              Filter
            </button>
          </div>
          <div class="tabs tabs-box">
            <button class="tab tab-active" type="button">Board</button>
            <button class="tab" type="button" disabled>List</button>
          </div>
        </div>
      </section>

      <section class="task-board" aria-label="Task board">
        <article class="task-column" th:each="column : ${columns}">
          <header class="flex items-center justify-between gap-3">
            <div class="flex min-w-0 items-center gap-2">
              <span class="flex h-8 w-8 items-center justify-center rounded-box bg-base-200 text-base-content/70">
                <svg class="icon" aria-hidden="true">
                  <use th:href="@{'/vendor/lucide/sprite.svg#' + ${column.icon}}"></use>
                </svg>
              </span>
              <h2 class="truncate font-bold tracking-normal" th:text="${column.title}">Todo</h2>
            </div>
            <span class="badge badge-outline" th:text="${#lists.size(column.tasks)}">0</span>
          </header>

          <div class="mt-4 grid gap-3" th:if="${!#lists.isEmpty(column.tasks)}">
            <a class="task-card" href="#" th:each="task : ${column.tasks}">
              <h3 class="font-semibold tracking-normal" th:text="${task.title}">Task title</h3>
              <div class="mt-3 flex flex-wrap gap-2">
                <span class="badge badge-info" th:if="${task.subject != null}" th:text="${task.subject}">Subject</span>
                <span class="badge" th:if="${task.teacher != null}" th:text="${task.teacher}">Teacher</span>
                <span class="badge badge-outline" th:if="${task.semester != null}" th:text="${task.semester}">Semester</span>
              </div>
            </a>
          </div>

          <div class="empty-column" th:if="${#lists.isEmpty(column.tasks)}">
            <svg class="h-5 w-5 text-base-content/45" aria-hidden="true">
              <use th:href="@{/vendor/lucide/sprite.svg#inbox}"></use>
            </svg>
            <p>No tasks in this status</p>
          </div>
        </article>
      </section>
    </main>
  </div>
</div>
</body>
</html>
